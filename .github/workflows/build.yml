name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and build backend
        working-directory: backend
        run: mvn -B test package

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-platform/pyproject.toml
      - name: Test Agent Platform
        working-directory: agent-platform
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -m "not integration"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Google Workspace MCP
        working-directory: mcp/google-workspace
        run: |
          npm install
          npm run build
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
