name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Google Workspace MCP
        working-directory: mcp/google-workspace
        run: |
          npm install
          npm run build
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
