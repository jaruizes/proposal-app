[project]
name="proposal-agent-platform"
version="0.1.0"
description="Independent agent platform for Proposal Copilot and future applications"
readme="README.md"
requires-python=">=3.11"
dependencies=[
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "anthropic>=0.69,<1.0",
  "pgvector>=0.4,<1.0",
  "redis>=6.4,<7.0",
  "python-multipart>=0.0.20,<1.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0"
]

[project.optional-dependencies]
dev=["pytest>=8.4,<9.0","pytest-asyncio>=1.1,<2.0","httpx>=0.28,<1.0"]

[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["src/agent_platform"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
asyncio_mode="auto"
markers=["integration: tests that call external providers and require explicit credentials"]
