services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: agent_platform
    ports:["5433:5432"]
    volumes:[agent-platform-postgres-data:/var/lib/postgresql/data]
    healthcheck:{test:["CMD-SHELL","pg_isready -U agent_platform -d agent_platform"],interval:5s,timeout:3s,retries:10}
  valkey:
    image: valkey/valkey:8-alpine
    ports:["6379:6379"]
    healthcheck:{test:["CMD","valkey-cli","ping"],interval:5s,timeout:3s,retries:10}
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4319:4317"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command:["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:[jaeger]
  agent-platform:
    build:{context:..,dockerfile:agent-platform/Dockerfile}
    environment:
      DATABASE_URL: postgresql+asyncpg://agent_platform:agent_platform@postgres:5432/agent_platform
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-sonnet-4-6}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-embedding-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      CACHE_BACKEND: ${CACHE_BACKEND:-valkey}
      CACHE_URL: ${CACHE_URL:-redis://valkey:6379/0}
      CACHE_PREFIX: ${CACHE_PREFIX:-agent-platform}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      RETRIEVAL_CACHE_TTL_SECONDS: ${RETRIEVAL_CACHE_TTL_SECONDS:-900}
      COGNITIVE_CACHE_TTL_SECONDS: ${COGNITIVE_CACHE_TTL_SECONDS:-900}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-proposal-agent-platform}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      GOOGLE_WORKSPACE_MCP_ENABLED: ${GOOGLE_WORKSPACE_MCP_ENABLED:-true}
      GOOGLE_WORKSPACE_MCP_COMMAND: node
      GOOGLE_WORKSPACE_MCP_SCRIPT: /opt/mcp/google-workspace/dist/server.js
      GOOGLE_WORKSPACE_MCP_CWD: /opt/mcp/google-workspace
      GOOGLE_OAUTH_CREDENTIALS: /run/secrets/google/google-oauth-credentials.json
      GOOGLE_OAUTH_TOKEN: /run/secrets/google/google-token.json
    ports:["8000:8000"]
    volumes:["../.secrets:/run/secrets/google","../workspace:/opt/workspace"]
    depends_on:
      postgres:{condition:service_healthy}
      valkey:{condition:service_healthy}
      otel-collector:{condition:service_started}
    healthcheck:{test:["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"],interval:5s,timeout:3s,retries:10}
volumes:
  agent-platform-postgres-data:
