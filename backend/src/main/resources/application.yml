spring:
  application:
    name: proposal-platform-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 27MB
  codec:
    max-in-memory-size: 8MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/proposal}
    username: ${DB_USER:proposal}
    password: ${DB_PASSWORD:proposal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}

agent-platform:
  transport: ${AGENT_PLATFORM_TRANSPORT:nats}
  base-url: ${AGENT_PLATFORM_URL:http://localhost:8000}
  api-key: ${AGENT_PLATFORM_API_KEY:}
  poll-interval: ${AGENT_PLATFORM_POLL_INTERVAL:1s}
  execution-timeout: ${AGENT_PLATFORM_EXECUTION_TIMEOUT:10m}
  proposal-execution-timeout: ${AGENT_PLATFORM_PROPOSAL_EXECUTION_TIMEOUT:30m}
  nats:
    url: ${NATS_URL:nats://localhost:4222}
    command-subject: ${AGENT_PLATFORM_COMMAND_SUBJECT:agent-platform.commands.execution.requested}
    events-subject: ${AGENT_PLATFORM_EVENTS_SUBJECT:agent-platform.events.execution.*}
    events-durable: ${AGENT_PLATFORM_EVENTS_DURABLE:proposal-backend-events}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  version: ${ANTHROPIC_VERSION:2023-06-01}
  fallback-to-mock: ${ANTHROPIC_FALLBACK_TO_MOCK:false}

mcp:
  google-workspace:
    command: ${GOOGLE_WORKSPACE_MCP_COMMAND:node}
    script: ${GOOGLE_WORKSPACE_MCP_SCRIPT:/app/mcp/google-workspace/dist/server.js}

presentation:
  template-id: ${GOOGLE_SLIDES_TEMPLATE_ID:}

proposal-document:
  template-id: ${PROPOSAL_TEMPLATE_ID:}
  renderer-url: ${DOCUMENT_RENDERER_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
